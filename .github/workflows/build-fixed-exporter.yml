name: Build fixed penpot images

on:
  workflow_dispatch:
  push:
    branches:
      - fix-export-build

permissions:
  contents: read
  packages: write

jobs:
  build-exporter:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Configure git proxy
        run: |
          git config --global http.https://github.com.proxy socks5h://proxyme:proxyme@192.168.50.253:18100
          git config --global http.proxy ""

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devenv image
        run: docker pull penpotapp/devenv:latest

      - name: Build exporter bundle (with #11506 fix)
        run: |
          export ORGANIZATION=penpotapp
          export DEVENV_IMGNAME="penpotapp/devenv"
          export DEVENV_TAG=latest
          ./manage.sh build-exporter-bundle

      - name: Create patched exporter Dockerfile
        run: |
          cat > docker/images/Dockerfile.exporter.patched <<'EOF'
          FROM penpotapp/exporter:2.17.2
          USER root
          COPY bundle-exporter/ /opt/penpot/exporter/
          RUN chown -R penpot:penpot /opt/penpot/exporter
          USER penpot:penpot
          CMD ["node", "app.js"]
          EOF

      - name: Build patched exporter image
        run: |
          rsync -avr --delete ./bundles/exporter/ ./docker/images/bundle-exporter/
          cd docker/images
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/penpot-exporter:fix-11506 \
            --build-arg BUNDLE_PATH="./bundle-exporter/" \
            -f Dockerfile.exporter.patched .

      - name: Push exporter image
        run: docker push ghcr.io/${{ github.repository_owner }}/penpot-exporter:fix-11506